
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Nafisat | Student Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <p>I'd love to hear from you. Feel free to get in touch.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="planner.html">Academic Planner</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="contact-section">

            <h2>Get in Touch</h2>

            <p>
                You can use the form below to send me a message.
                I look forward to hearing from you.
            </p>

            <form id="contactForm" novalidate>

                <div class="form-group">
                    <label for="name">Full Name:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        minlength="2"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        inputmode="numeric"
                        required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        minlength="5"
                        placeholder="Write your message here"
                        required></textarea>
                </div>

                <button type="submit">Send Message</button>

                <p id="formMessage" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Nafisat's Cybersecurity Portfolio.
            All rights reserved.
        </p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
